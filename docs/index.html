<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta name="description" content="Agent 学习书架">
    <title>Agent 学习书架</title>
    <!-- Hello-Agents 使用的 Docsify Vue 主题。 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  </head>
  <body>
    <div id="app">正在加载 Agent 学习书架…</div>
    <script>
      window.$docsify = {
        name: 'Agent 学习书架',
        repo: '',
        homepage: 'index.md',
        loadSidebar: true,
        // QA 作为子模块挂载时，继续沿用主学习库的导航，避免子模块
        // 独立站点的根路径链接跳出当前目录。
        alias: {
          '/13-interview-qa/_sidebar.md': '/_sidebar.md'
        },
        auto2top: true,
        // 与 Hello-Agents 一致：仅展开当前页面的正文目录。
        subMaxLevel: 3,
        // 所有生成的章节链接使用站点根路径，避免在 GitHub Pages 的嵌套路由
        // 中被拼接到当前章节而产生 404。
        relativePath: false,
        pagination: {
          previousText: '上一章节',
          nextText: '下一章节'
        },
        count: {
          countable: true,
          fontsize: '0.9em',
          color: 'rgb(90,90,90)',
          language: 'chinese'
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@latest/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="https://unpkg.com/docsify-count/dist/countable.js"></script>
  </body>
</html>
